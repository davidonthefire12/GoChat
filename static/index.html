<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>LAN Chat</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #f4f5f7;
            --surface: #ffffff;
            --border: #e3e6eb;
            --border-soft: #eceef2;
            --text: #1c2230;
            --muted: #6b7385;
            --accent: #3f5bd8;
            --accent-hover: #3550c4;
            --accent-soft: #eef1fd;
            --sidebar: #171c2b;
            --sidebar-hover: #222a40;
            --sidebar-text: #c3c9d9;
            --sidebar-muted: #7f879c;
            --danger: #d1344b;
            --ok: #1f9d6b;
            --radius: 8px;
        }

        * { box-sizing: border-box; }
        html, body { height: 100%; margin: 0; }
        body {
            font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, Arial, sans-serif;
            font-size: 14px;
            background: var(--bg);
            color: var(--text);
            -webkit-font-smoothing: antialiased;
        }
        button { font-family: inherit; font-size: 13px; font-weight: 600; border: none; cursor: pointer; white-space: nowrap; }
        button:disabled { opacity: 0.6; cursor: default; }
        input { font-family: inherit; }

        .avatar {
            flex: none; width: 32px; height: 32px; border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            color: #fff; font-weight: 600; font-size: 13px; position: relative;
        }

        /* ---------- Login ---------- */
        #join { min-height: 100%; align-items: center; justify-content: center; padding: 24px; background: var(--bg); }
        .login-card {
            width: 100%; max-width: 380px; background: var(--surface); border: 1px solid var(--border);
            border-radius: 12px; padding: 32px; box-shadow: 0 1px 2px rgba(20, 28, 50, 0.04), 0 12px 32px rgba(20, 28, 50, 0.06);
        }
        .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 15px; margin-bottom: 24px; }
        .brand-mark { width: 28px; height: 28px; border-radius: 7px; background: var(--accent); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 13px; }
        .login-card h1 { font-size: 20px; margin: 0 0 4px; font-weight: 700; }
        .login-card .sub { color: var(--muted); margin: 0 0 22px; font-size: 13px; }
        .field { display: block; margin-bottom: 14px; }
        .field span { display: block; font-size: 12px; font-weight: 600; color: #3d4559; margin-bottom: 6px; }
        .field input {
            width: 100%; padding: 10px 12px; font-size: 14px; color: var(--text); background: #fff;
            border: 1px solid var(--border); border-radius: var(--radius); outline: none;
        }
        .field input:focus, #inputRow:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(63, 91, 216, 0.15); }
        .btn-primary { background: var(--accent); color: #fff; border-radius: var(--radius); padding: 10px 16px; }
        .btn-primary:hover:not(:disabled) { background: var(--accent-hover); }
        #joinBtn { width: 100%; margin-top: 4px; }
        #joinError { color: var(--danger); font-size: 13px; font-weight: 500; min-height: 1.3em; margin-top: 12px; }

        /* ---------- App shell ---------- */
        .app { height: 100vh; height: 100dvh; grid-template-columns: 272px minmax(0, 1fr); }

        #sidebar { background: var(--sidebar); color: var(--sidebar-text); display: flex; flex-direction: column; min-height: 0; }
        .side-brand { display: flex; align-items: center; gap: 10px; padding: 18px 18px 14px; color: #fff; font-weight: 700; font-size: 15px; }
        .side-scroll { flex: 1; overflow-y: auto; padding: 4px 10px 12px; }
        .side-label {
            display: flex; justify-content: space-between; padding: 14px 8px 6px;
            font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--sidebar-muted);
        }
        .channel { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 6px; color: var(--sidebar-text); font-weight: 500; }
        .channel.active { background: var(--sidebar-hover); color: #fff; box-shadow: inset 3px 0 0 var(--accent); }
        .channel .hash { color: var(--sidebar-muted); font-weight: 600; }
        #memberList { list-style: none; margin: 0; padding: 0; }
        #memberList li { display: flex; align-items: center; gap: 10px; padding: 6px 8px; border-radius: 6px; font-weight: 500; }
        #memberList li:hover { background: var(--sidebar-hover); }
        #memberList li.offline { color: var(--sidebar-muted); }
        #memberList .avatar { width: 24px; height: 24px; font-size: 11px; border-radius: 6px; }
        #memberList .dot { position: absolute; right: -3px; bottom: -3px; width: 9px; height: 9px; border-radius: 50%; background: var(--sidebar-muted); border: 2px solid var(--sidebar); }
        #memberList li:not(.offline) .dot { background: var(--ok); }
        #memberList .you { color: var(--sidebar-muted); font-size: 12px; font-weight: 400; }
        .side-user { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-top: 1px solid rgba(255, 255, 255, 0.08); }
        #whoami { flex: 1; min-width: 0; color: #fff; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        #logoutBtn { background: rgba(255, 255, 255, 0.08); color: var(--sidebar-text); border-radius: 6px; padding: 6px 10px; font-size: 12px; }
        #logoutBtn:hover { background: rgba(255, 255, 255, 0.16); color: #fff; }

        /* ---------- Workspace ---------- */
        .workspace { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--surface); }
        .topbar { display: flex; align-items: center; gap: 14px; padding: 0 24px; height: 60px; flex: none; border-bottom: 1px solid var(--border); }
        #menuBtn { display: none; background: none; color: var(--text); font-size: 20px; padding: 4px 8px; }
        .topbar h1 { margin: 0; font-size: 16px; font-weight: 700; }
        .topbar .topic { color: var(--muted); font-size: 13px; }
        .top-right { margin-left: auto; display: flex; align-items: center; gap: 16px; font-size: 12.5px; font-weight: 500; color: var(--muted); }
        #status { font-weight: 600; }

        #messagesWrap { position: relative; flex: 1; min-height: 0; display: flex; flex-direction: column; background: #fbfbfc; }
        #messages { flex: 1; min-height: 0; overflow-y: auto; padding: 8px 0 16px; overscroll-behavior: contain; }
        #newMsgBtn {
            display: none; position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); z-index: 5;
            background: var(--text); color: #fff; border-radius: 999px; padding: 7px 14px; box-shadow: 0 6px 18px rgba(20, 28, 50, 0.25);
        }
        #newMsgBtn.show { display: block; }

        .day-sep { display: flex; align-items: center; gap: 12px; margin: 14px 24px 6px; color: var(--muted); font-size: 12px; font-weight: 600; }
        .day-sep::before, .day-sep::after { content: ''; flex: 1; height: 1px; background: var(--border); }

        /* ---------- Messages: compact rows, not bubbles ---------- */
        .msg {
            position: relative; display: flex; gap: 12px; padding: 9px 24px 9px 21px;
            border-left: 3px solid transparent; border-bottom: 1px solid var(--border-soft); background: var(--surface);
        }
        .msg.own { background: var(--accent-soft); border-left-color: var(--accent); }
        .msg:hover { background: #f6f7f9; }
        .msg.own:hover { background: #e8edfc; }
        .msg-body { flex: 1; min-width: 0; }
        .msg-head { display: flex; align-items: baseline; gap: 8px; margin-bottom: 2px; }
        .username { font-weight: 600; font-size: 13.5px; }
        .msg.own .username { color: var(--accent); }
        .timestamp, .edited-tag { font-size: 12px; color: var(--muted); }
        .edited-tag { font-style: italic; }
        .text { line-height: 1.5; overflow-wrap: anywhere; white-space: pre-wrap; }
        .edit-input { width: 100%; font-size: 14px; padding: 6px 10px; border: 1px solid var(--accent); border-radius: 6px; outline: none; }

        .msg-tools {
            position: absolute; top: 6px; right: 16px; display: none; gap: 2px; padding: 3px; z-index: 3;
            background: var(--surface); border: 1px solid var(--border); border-radius: 8px; box-shadow: 0 4px 12px rgba(20, 28, 50, 0.10);
        }
        /* Mouse/trackpad only: touch browsers keep :hover and :focus-within "stuck" after a tap */
        @media (hover: hover) and (pointer: fine) {
            .msg:hover .msg-tools, .msg:focus-within .msg-tools { display: flex; }
        }
        /* Touch devices: hidden until the message is tapped (see .show-tools) */
        .msg.show-tools .msg-tools { display: flex; }
        .msg-tools button { background: none; color: var(--muted); padding: 4px 9px; border-radius: 5px; font-size: 12px; }
        .msg-tools button:hover { background: var(--accent-soft); color: var(--accent); }
        .msg-tools button.danger:hover { background: #fdecef; color: var(--danger); }

        .reply-quote {
            border-left: 3px solid #9aa7e8; background: rgba(28, 34, 48, 0.045); border-radius: 0 6px 6px 0;
            padding: 5px 10px; margin: 2px 0 6px; font-size: 12.5px; cursor: pointer; max-width: 640px;
        }
        .msg.own .reply-quote { background: rgba(255, 255, 255, 0.7); }
        .reply-quote:hover { background: rgba(28, 34, 48, 0.08); }
        .rq-name { display: block; font-weight: 600; color: var(--accent); }
        .rq-text { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; color: var(--muted); }
        .reply-quote.deleted { cursor: default; border-left-color: var(--border); }
        .reply-quote.deleted .rq-name { color: var(--muted); }
        .reply-quote.deleted .rq-text { font-style: italic; }
        .msg.flash { animation: flash 1.4s ease-out; }
        @keyframes flash { 0%, 40% { background: #fff4c9; } }

        /* ---------- Composer ---------- */
        .composer-area { flex: none; padding: 12px 24px 14px; background: var(--surface); border-top: 1px solid var(--border); }
        #replyBar {
            align-items: center; gap: 10px; padding: 8px 8px 8px 12px; margin-bottom: 10px;
            background: var(--accent-soft); border-left: 3px solid var(--accent); border-radius: 0 6px 6px 0;
        }
        .reply-bar-body { flex: 1; min-width: 0; display: flex; flex-direction: column; font-size: 12.5px; }
        #replyName { font-weight: 600; color: var(--accent); }
        #replyText { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        #replyCancel { width: 24px; height: 24px; padding: 0; background: none; color: var(--muted); border-radius: 5px; font-size: 13px; }
        #replyCancel:hover { background: rgba(28, 34, 48, 0.08); color: var(--text); }

        #inputRow { position: relative; display: flex; align-items: center; gap: 6px; padding: 6px 6px 6px 8px; background: #fff; border: 1px solid var(--border); border-radius: 10px; }
        #emojiBtn { background: none; font-size: 18px; padding: 4px 6px; border-radius: 6px; }
        #emojiBtn:hover { background: var(--bg); }
        #msgInput { flex: 1; min-width: 0; border: none; outline: none; font-size: 14px; padding: 8px 4px; background: none; color: var(--text); }
        #sendBtn { padding: 8px 18px; }
        .composer-hint { margin-top: 6px; font-size: 11.5px; color: var(--muted); }

        #emojiPicker {
            display: none; position: absolute; bottom: calc(100% + 10px); left: 0; width: 300px; max-height: 260px; overflow-y: auto;
            background: #fff; border: 1px solid var(--border); border-radius: 10px; padding: 8px;
            box-shadow: 0 12px 32px rgba(20, 28, 50, 0.16); grid-template-columns: repeat(7, 1fr); gap: 2px; z-index: 10;
        }
        #emojiPicker.open { display: grid; }
        #emojiPicker .emoji-label { grid-column: 1 / -1; font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; margin: 6px 0 2px 2px; }
        #emojiPicker .emoji-label:first-child { margin-top: 0; }
        #emojiPicker button { background: none; padding: 4px; font-size: 20px; line-height: 1; border-radius: 6px; }
        #emojiPicker button:hover { background: var(--bg); }

        /* ---------- Responsive ---------- */
        #scrim { display: none; }
        @media (max-width: 820px) {
            .app { grid-template-columns: minmax(0, 1fr); }
            #sidebar { position: fixed; inset: 0 auto 0 0; width: 280px; z-index: 30; transform: translateX(-100%); transition: transform 0.2s; }
            .sidebar-open #sidebar { transform: none; }
            .sidebar-open #scrim { display: block; position: fixed; inset: 0; background: rgba(15, 20, 35, 0.45); z-index: 20; }
            #menuBtn { display: block; }
            .topbar, .composer-area { padding-left: 14px; padding-right: 14px; }
            .topbar .topic, .composer-hint { display: none; }
            .msg { padding-left: 11px; padding-right: 14px; }
            .day-sep { margin-left: 14px; margin-right: 14px; }
        }
    </style>
</head>
<body>
    <!-- Sign in -->
    <div id="join" style="display:none;">
        <div class="login-card">
            <div class="brand"><span class="brand-mark">LC</span> LAN Chat</div>
            <h1>Sign in</h1>
            <p class="sub">Use the account provided by your administrator.</p>
            <label class="field"><span>Username</span>
                <input type="text" id="nameInput" maxlength="30" autocomplete="username"
                       onkeydown="if(event.key==='Enter') joinChat()" />
            </label>
            <label class="field"><span>Password</span>
                <input type="password" id="passInput" maxlength="100" autocomplete="current-password"
                       onkeydown="if(event.key==='Enter') joinChat()" />
            </label>
            <button class="btn-primary" id="joinBtn" onclick="joinChat()">Sign in</button>
            <div id="joinError" role="alert"></div>
        </div>
    </div>

    <!-- Application -->
    <div id="chat" class="app" style="display:none;">
        <aside id="sidebar">
            <div class="side-brand"><span class="brand-mark">LC</span> LAN Chat</div>
            <div class="side-scroll">
                <div class="side-label">Channels</div>
                <div class="channel active"><span class="hash">#</span> General</div>
                <div class="side-label"><span>Members</span><span id="memberCount"></span></div>
                <ul id="memberList"></ul>
            </div>
            <div class="side-user">
                <span id="whoami"></span>
                <button type="button" id="logoutBtn" onclick="logout()">Log out</button>
            </div>
        </aside>
        <div id="scrim" onclick="toggleSidebar()"></div>

        <main class="workspace">
            <header class="topbar">
                <button type="button" id="menuBtn" aria-label="Open menu" onclick="toggleSidebar()">☰</button>
                <h1># General</h1>
                <span class="topic">Team-wide conversation</span>
                <div class="top-right"><span id="onlineCount"></span><span id="status"></span></div>
            </header>

            <div id="messagesWrap">
                <div id="messages"></div>
                <button type="button" id="newMsgBtn" onclick="scrollToBottom(true)">↓ New messages</button>
            </div>

            <div class="composer-area">
                <div id="replyBar" style="display:none;">
                    <div class="reply-bar-body">
                        <span id="replyName"></span>
                        <span id="replyText"></span>
                    </div>
                    <button type="button" id="replyCancel" aria-label="Cancel reply" onclick="clearReply()">✕</button>
                </div>
                <div id="inputRow">
                    <div id="emojiPicker"></div>
                    <button type="button" id="emojiBtn" aria-label="Emoji" onclick="toggleEmojiPicker()">😊</button>
                    <input type="text" id="msgInput" placeholder="Message #General" maxlength="1000" autocomplete="off"
                           onkeydown="if(event.key==='Enter') sendMessage(); else if(event.key==='Escape') clearReply()" />
                    <button type="button" class="btn-primary" id="sendBtn" onclick="sendMessage()">Send</button>
                </div>
                <div class="composer-hint">Press Enter to send · Esc cancels a reply</div>
            </div>
        </main>
    </div>

    <script>
        let ws;
        let username = '';
        let editingId = null; // only one message editable at a time
        let replyingTo = null; // {id, username, text} of the message being replied to

        // Session / connection state
        let authed = false;
        let intentionalClose = false;
        let reconnectTimer = null;
        let reconnectDelay = 1000;
        let initialLoad = true;
        let lastDay = null; // for day separators

        // Scroll state. stickToBottom is true while the reader is at (or near)
        // the bottom; it stops new messages from yanking someone who scrolled
        // up to read older ones.
        let stickToBottom = true;
        let autoScrolling = false; // true while our own scroll animation runs
        let autoScrollTimer = null;
        const REPLY_PREVIEW_LEN = 120;

        // --- New-message notifications ---------------------------------
        const originalTitle = document.title;
        let unreadCount = 0;

        function requestNotificationPermission() {
            if (!('Notification' in window)) return;
            if (Notification.permission === 'default') Notification.requestPermission();
        }

        // Only alerts if the person isn't currently looking at the tab.
        function notifyNewMessage(msg) {
            if (document.hasFocus() && !document.hidden) return;
            unreadCount++;
            document.title = '(' + unreadCount + ') ' + originalTitle;
            playPing();
            if ('Notification' in window && Notification.permission === 'granted') {
                const n = new Notification(msg.username, { body: msg.text, tag: 'lan-chat' });
                n.onclick = function() { window.focus(); n.close(); };
            }
        }

        function clearUnread() {
            if (unreadCount === 0) return;
            unreadCount = 0;
            document.title = originalTitle;
        }
        window.addEventListener('focus', clearUnread);
        document.addEventListener('visibilitychange', function() { if (!document.hidden) clearUnread(); });

        function playPing() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.value = 880;
                gain.gain.setValueAtTime(0.15, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.3);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.3);
            } catch (err) { /* audio blocked - no sound, no problem */ }
        }

        // --- Emoji picker ----------------------------------------------
        const EMOJI_CATEGORIES = [
            { label: 'Smileys', emojis: [
                '😀','😁','😂','🤣','😊','😇','🙂','🙃','😉','😍',
                '🥰','😘','😗','😋','😜','🤪','😝','🤑','🤔','🤨',
                '😐','😑','😶','🙄','😏','😒','😬','🤐','😴','😪',
                '😷','🤒','🤕','🥵','🥶','😵','🤯','🥳','😎','🤓',
                '😕','😟','🙁','😮','😯','😲','😳','🥺','😦','😧',
                '😨','😰','😥','😢','😭','😱','😖','😣','😞','😓',
                '😩','😫','🥱','😤','😡','😠','🤬','😈','👿','💀'
            ]},
            { label: 'Gestures & People', emojis: [
                '👋','🤚','🖐️','✋','🖖','👌','🤌','🤏','✌️','🤞',
                '🤟','🤘','🤙','👈','👉','👆','🖕','👇','☝️','👍',
                '👎','✊','👊','🤛','🤜','👏','🙌','👐','🤲','🙏',
                '💪','🫶','🤝','🙋','🧑','👶','🧓','👴','👵','🧕'
            ]},
            { label: 'Hearts & Symbols', emojis: [
                '❤️','🧡','💛','💚','💙','💜','🖤','🤍','🤎','💔',
                '❣️','💕','💞','💓','💗','💖','💘','💝','💟','✨',
                '⭐','🌟','💫','⚡','🔥','💯','✅','❌','❓','❗',
                '☮️','☯️','♻️','💤','💢','💥','💦','💨'
            ]},
            { label: 'Animals & Nature', emojis: [
                '🐶','🐱','🐭','🐹','🐰','🦊','🐻','🐼','🐨','🐯',
                '🦁','🐮','🐷','🐸','🐵','🙈','🙉','🙊','🐔','🐧',
                '🐦','🦋','🐢','🐍','🐙','🦀','🐳','🐬','🦄','🐝',
                '☀️','🌤️','⛅','🌧️','⛈️','❄️','🌈','🌙','🌊','🌸'
            ]},
            { label: 'Food & Drink', emojis: [
                '🍏','🍎','🍌','🍉','🍇','🍓','🍒','🍑','🥭','🍍',
                '🥑','🍕','🍔','🌭','🍟','🌮','🌯','🍜','🍣','🍩',
                '🍪','🎂','🍰','🍫','🍿','🧁','☕','🍺','🍷','🥤'
            ]},
            { label: 'Activities & Objects', emojis: [
                '🚀','⚽','🏀','🏈','🎮','🎲','🎸','🎨','🎬','📷',
                '🎧','🎁','🎉','🎈','🏆','⏰','💡','📱','💻','📚',
                '✈️','🚗','🚲','🏠','🌍','🔑','💰','💎'
            ]}
        ];

        function buildEmojiPicker() {
            const picker = document.getElementById('emojiPicker');
            EMOJI_CATEGORIES.forEach(function(category) {
                const label = document.createElement('div');
                label.className = 'emoji-label';
                label.textContent = category.label;
                picker.appendChild(label);
                category.emojis.forEach(function(emoji) {
                    const btn = document.createElement('button');
                    btn.type = 'button';
                    btn.textContent = emoji;
                    btn.onclick = function() { insertEmoji(emoji); };
                    picker.appendChild(btn);
                });
            });
        }
        function toggleEmojiPicker() { document.getElementById('emojiPicker').classList.toggle('open'); }
        function closeEmojiPicker() { document.getElementById('emojiPicker').classList.remove('open'); }

        function insertEmoji(emoji) {
            const input = document.getElementById('msgInput');
            const start = input.selectionStart ?? input.value.length;
            const end = input.selectionEnd ?? input.value.length;
            input.value = input.value.slice(0, start) + emoji + input.value.slice(end);
            const cursor = start + emoji.length;
            input.focus();
            input.setSelectionRange(cursor, cursor);
            closeEmojiPicker();
        }

        document.addEventListener('click', function(e) {
            const picker = document.getElementById('emojiPicker');
            const btn = document.getElementById('emojiBtn');
            if (picker.classList.contains('open') && !picker.contains(e.target) && e.target !== btn) closeEmojiPicker();
        });
        buildEmojiPicker();

        // Only re-anchor if the reader was already at the bottom, never while reading history.
        function reanchor() { if (stickToBottom) scrollToBottom(false); }
        if (window.visualViewport) window.visualViewport.addEventListener('resize', reanchor);
        document.getElementById('msgInput').addEventListener('focus', reanchor);

        function toggleSidebar() { document.getElementById('chat').classList.toggle('sidebar-open'); }

        // ---------------- Session / auth ----------------
        // The session lives in an HttpOnly cookie set by the server, so no
        // token is ever readable by (or stored by) page JavaScript.
        async function api(path, body) {
            const res = await fetch(path, {
                method: body === undefined ? 'GET' : 'POST',
                headers: body === undefined ? {} : { 'Content-Type': 'application/json' },
                body: body === undefined ? undefined : JSON.stringify(body),
                credentials: 'same-origin',
                cache: 'no-store'
            });
            let data = {};
            try { data = await res.json(); } catch (err) { /* empty body */ }
            return { ok: res.ok, status: res.status, data: data };
        }

        // Runs on page load: a valid cookie goes straight to the chat.
        async function boot() {
            try {
                const r = await api('/api/session');
                if (r.ok) { enterChat(r.data.username); return; }
                showLogin('');
            } catch (err) {
                showLogin("Can't reach the server. Check your connection and refresh.");
            }
        }

        function enterChat(name) {
            username = name;
            authed = true;
            intentionalClose = false;
            initialLoad = true;
            reconnectDelay = 1000;
            document.getElementById('whoami').textContent = name;
            document.getElementById('join').style.display = 'none';
            document.getElementById('chat').style.display = 'grid';
            hideJoinError();
            connect();
        }

        function showLogin(message) {
            document.getElementById('chat').style.display = 'none';
            document.getElementById('join').style.display = 'flex';
            document.getElementById('passInput').value = '';
            showJoinError(message || '');
        }

        // Tears down all per-session state, then shows the login form.
        function leaveChat(message) {
            authed = false;
            intentionalClose = true;
            clearTimeout(reconnectTimer);
            if (ws) { ws.close(); ws = null; }
            document.getElementById('messages').innerHTML = '';
            document.getElementById('memberList').innerHTML = '';
            document.getElementById('chat').classList.remove('sidebar-open');
            lastDay = null;
            clearReply();
            setPill(false);
            username = '';
            showLogin(message);
        }

        async function joinChat() {
            const name = document.getElementById('nameInput').value.trim();
            const pass = document.getElementById('passInput').value;
            if (!name) { showJoinError('Enter your username.'); return; }
            if (pass.length < 4) { showJoinError('Password must be at least 4 characters.'); return; }
            hideJoinError();
            requestNotificationPermission();

            const btn = document.getElementById('joinBtn');
            btn.disabled = true;
            try {
                const r = await api('/api/login', { username: name, password: pass });
                if (r.ok) {
                    document.getElementById('passInput').value = '';
                    enterChat(r.data.username);
                } else {
                    showJoinError(r.data.error || 'Sign-in failed.');
                }
            } catch (err) {
                showJoinError("Can't reach the server.");
            } finally {
                btn.disabled = false;
            }
        }

        async function logout() {
            try {
                const r = await api('/api/logout', {});
                if (!r.ok) throw new Error('logout failed');
            } catch (err) {
                // Don't pretend we're logged out while the session is still alive server-side.
                setStatus('Could not log out - check your connection.', '#d1344b');
                return;
            }
            leaveChat('');
        }

        function connect() {
            if (!authed) return;
            const proto = location.protocol === 'https:' ? 'wss' : 'ws';
            const sock = new WebSocket(proto + '://' + location.host + '/ws');
            ws = sock;
            setStatus('Connecting…', '#6b7385');

            sock.onopen = function() {
                reconnectDelay = 1000;
                setStatus('● Connected', '#1f9d6b');
            };

            sock.onmessage = function(e) {
                let msg;
                try { msg = JSON.parse(e.data); } catch (err) { return; }

                if (msg.type === 'joined') {
                    username = msg.username; // server is the source of truth for casing
                    document.getElementById('whoami').textContent = username;
                } else if (msg.type === 'history') {
                    handleHistory(msg.history || []);
                } else if (msg.type === 'presence') {
                    renderMembers(msg.members || []);
                } else if (msg.type === 'message') {
                    handleIncoming(msg);
                } else if (msg.type === 'edit') {
                    updateMessage(msg);
                } else if (msg.type === 'delete') {
                    removeMessage(msg.id);
                }
            };

            sock.onclose = function() {
                if (sock !== ws || intentionalClose || !authed) return;
                setStatus('● Reconnecting…', '#d1344b');
                scheduleReconnect();
            };
            sock.onerror = function() { sock.close(); };
        }

        // Before every reconnect, ask whether the session is still valid. A
        // 401 means it expired (or we logged out elsewhere): back to sign-in
        // instead of retrying forever.
        function scheduleReconnect() {
            clearTimeout(reconnectTimer);
            reconnectTimer = setTimeout(async function() {
                if (!authed) return;
                try {
                    const r = await api('/api/session');
                    if (r.status === 401) {
                        leaveChat('Your session has expired. Please sign in again.');
                        return;
                    }
                } catch (err) { /* server unreachable - just try again */ }
                connect();
            }, reconnectDelay);
            reconnectDelay = Math.min(reconnectDelay * 2, 15000);
        }

        // Full history arrives on first connect and after each reconnect. Jump
        // to the bottom on first load; on a reconnect, leave a reader who
        // scrolled up where they were.
        function handleHistory(list) {
            const el = document.getElementById('messages');
            const follow = initialLoad || stickToBottom;
            const prevTop = el.scrollTop;
            el.innerHTML = '';
            lastDay = null;
            list.forEach(addMessage);
            if (follow) scrollToBottom(false); // instant: no point animating through hundreds of messages
            else el.scrollTop = prevTop;
            initialLoad = false;
        }

        function handleIncoming(msg) {
            const own = msg.username.toLowerCase() === username.toLowerCase();
            const follow = stickToBottom; // sample BEFORE the new row changes the geometry
            addMessage(msg);
            if (follow) scrollToBottom(true);
            else if (!own) setPill(true); // reader is scrolled up: don't move them, just hint
            if (!own) notifyNewMessage(msg);
        }

        // ---------------- Members sidebar ----------------
        function renderMembers(list) {
            const ul = document.getElementById('memberList');
            ul.innerHTML = '';
            const sorted = list.slice().sort(function(a, b) {
                if (a.online !== b.online) return a.online ? -1 : 1;
                return a.username.toLowerCase().localeCompare(b.username.toLowerCase());
            });
            let online = 0;
            sorted.forEach(function(m) {
                if (m.online) online++;
                const li = document.createElement('li');
                if (!m.online) li.className = 'offline';
                const av = document.createElement('div');
                av.className = 'avatar';
                av.style.background = colorForName(m.username);
                av.textContent = m.username.charAt(0).toUpperCase();
                const dot = document.createElement('span');
                dot.className = 'dot';
                av.appendChild(dot);
                const name = document.createElement('span');
                name.textContent = m.username;
                li.appendChild(av);
                li.appendChild(name);
                if (m.username.toLowerCase() === username.toLowerCase()) {
                    const you = document.createElement('span');
                    you.className = 'you';
                    you.textContent = '(you)';
                    li.appendChild(you);
                }
                ul.appendChild(li);
            });
            document.getElementById('memberCount').textContent = online + ' online';
            document.getElementById('onlineCount').textContent = online + ' online';
        }

        function showJoinError(text) { document.getElementById('joinError').textContent = text; }
        function hideJoinError() { document.getElementById('joinError').textContent = ''; }

        function setStatus(text, color) {
            const el = document.getElementById('status');
            el.textContent = text;
            el.style.color = color;
        }

        function sendMessage() {
            const input = document.getElementById('msgInput');
            const text = input.value.trim();
            if (!text) return;

            if (!ws || ws.readyState !== WebSocket.OPEN) {
                setStatus('Not connected yet — hang on…', '#d1344b');
                return;
            }

            const payload = { type: 'message', text: text };
            if (replyingTo) payload.reply_to_id = replyingTo.id;
            ws.send(JSON.stringify(payload));
            input.value = '';
            clearReply();
            input.focus();
            clearUnread();
            scrollToBottom(true); // sending always brings you back to the bottom
        }

        // "hh:mm AM/PM" in the viewer's local time.
        function formatTimestamp(ts) {
            if (!ts) return '';
            const date = new Date(ts * 1000);
            let hours = date.getHours();
            const minutes = date.getMinutes().toString().padStart(2, '0');
            const ampm = hours >= 12 ? 'PM' : 'AM';
            hours = hours % 12;
            if (hours === 0) hours = 12;
            return hours.toString().padStart(2, '0') + ':' + minutes + ' ' + ampm;
        }

        function dayLabel(ts) {
            const d = new Date(ts * 1000);
            if (d.toDateString() === new Date().toDateString()) return 'Today';
            if (d.toDateString() === new Date(Date.now() - 864e5).toDateString()) return 'Yesterday';
            return d.toLocaleDateString(undefined, {
                weekday: 'short', month: 'short', day: 'numeric',
                year: d.getFullYear() === new Date().getFullYear() ? undefined : 'numeric'
            });
        }

        // Deterministic, muted color per username so a person always looks the same.
        function colorForName(name) {
            let hash = 0;
            for (let i = 0; i < name.length; i++) hash = name.charCodeAt(i) + ((hash << 5) - hash);
            return 'hsl(' + (Math.abs(hash) % 360) + ', 42%, 44%)';
        }

        function toolButton(label, cls, onClick) {
            const b = document.createElement('button');
            b.type = 'button';
            b.className = cls || '';
            b.textContent = label;
            b.addEventListener('click', function(e) {
                e.stopPropagation();
                const row = b.closest('.msg');
                if (row) row.classList.remove('show-tools');
                onClick();
            });
            return b;
        }

        // Renders one message as a compact row. All text goes through
        // textContent (never innerHTML) so names/bodies can't inject HTML.
        function addMessage(m) {
            const messages = document.getElementById('messages');
            const isOwn = m.username.toLowerCase() === username.toLowerCase();

            if (m.timestamp) {
                const key = new Date(m.timestamp * 1000).toDateString();
                if (key !== lastDay) {
                    lastDay = key;
                    const sep = document.createElement('div');
                    sep.className = 'day-sep';
                    sep.textContent = dayLabel(m.timestamp);
                    messages.appendChild(sep);
                }
            }

            const div = document.createElement('div');
            div.className = 'msg ' + (isOwn ? 'own' : 'other');
            div.dataset.id = m.id;
            div.dataset.username = m.username;

            const avatar = document.createElement('div');
            avatar.className = 'avatar';
            avatar.style.background = colorForName(m.username);
            avatar.textContent = m.username.charAt(0).toUpperCase();
            div.appendChild(avatar);

            const body = document.createElement('div');
            body.className = 'msg-body';

            const head = document.createElement('div');
            head.className = 'msg-head';
            const userSpan = document.createElement('span');
            userSpan.className = 'username';
            userSpan.textContent = m.username;
            const timeSpan = document.createElement('span');
            timeSpan.className = 'timestamp';
            timeSpan.textContent = formatTimestamp(m.timestamp);
            head.appendChild(userSpan);
            head.appendChild(timeSpan);
            body.appendChild(head);

            if (m.reply_to_id) body.appendChild(buildQuote(m.reply_to_id, m.reply));

            const text = document.createElement('div');
            text.className = 'text';
            text.textContent = m.text;
            body.appendChild(text);
            div.appendChild(body);

            // Hover toolbar: Reply on every message; Edit/Delete on your own.
            // (The server re-checks ownership; this just avoids offering what would be rejected.)
            const tools = document.createElement('div');
            tools.className = 'msg-tools';
            tools.appendChild(toolButton('↩ Reply', '', function() { startReply(div); }));
            if (isOwn) {
                tools.appendChild(toolButton('Edit', '', function() {
                    // Look up .text fresh: a prior edit replaces the node.
                    startEdit(div, m.id, div.querySelector('.text'));
                }));
                tools.appendChild(toolButton('Delete', 'danger', function() { confirmDelete(m.id); }));
            }
            div.appendChild(tools);

            messages.appendChild(div);
        }

        function confirmDelete(id) {
            if (!confirm('Delete this message? This cannot be undone.')) return;
            if (!ws || ws.readyState !== WebSocket.OPEN) return;
            ws.send(JSON.stringify({ type: 'delete', id: id }));
        }

        // Removes a message once the server confirms the delete, and marks any quotes of it.
        function removeMessage(id) {
            const div = document.querySelector('.msg[data-id="' + id + '"]');
            if (div) div.remove();
            document.querySelectorAll('.reply-quote[data-reply-id="' + id + '"]').forEach(setQuoteDeleted);
            if (replyingTo && replyingTo.id === id) clearReply();
        }

        // Swaps the text for an inline input. Enter saves, Escape cancels,
        // blur saves (so clicking away doesn't lose the edit).
        function startEdit(div, id, textEl) {
            if (editingId !== null) return;
            editingId = id;

            const original = textEl.textContent;
            const input = document.createElement('input');
            input.type = 'text';
            input.className = 'edit-input';
            input.maxLength = 1000;
            input.value = original;

            textEl.replaceWith(input);
            input.focus();
            input.select();

            let finished = false;
            function finish(save) {
                if (finished) return;
                finished = true;
                editingId = null;

                const newValue = input.value.trim();
                const newEl = document.createElement('div');
                newEl.className = 'text';
                newEl.textContent = (save && newValue) ? newValue : original;
                input.replaceWith(newEl);

                if (save && newValue && newValue !== original) {
                    ws.send(JSON.stringify({ type: 'edit', id: id, text: newValue }));
                }
            }

            input.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') finish(true);
                if (e.key === 'Escape') finish(false);
            });
            input.addEventListener('blur', function() { finish(true); });
        }

        // Applies a broadcast edit to the matching row, any quotes of it, and the reply bar.
        function updateMessage(m) {
            const div = document.querySelector('.msg[data-id="' + m.id + '"]');
            if (div) {
                const textEl = div.querySelector('.text');
                if (textEl) textEl.textContent = m.text;
                const head = div.querySelector('.msg-head');
                if (head && !head.querySelector('.edited-tag')) {
                    const tag = document.createElement('span');
                    tag.className = 'edited-tag';
                    tag.textContent = '(edited)';
                    head.appendChild(tag);
                }
            }
            document.querySelectorAll('.reply-quote[data-reply-id="' + m.id + '"] .rq-text').forEach(function(el) {
                el.textContent = clip(m.text);
            });
            if (replyingTo && replyingTo.id === m.id) {
                replyingTo.text = clip(m.text);
                document.getElementById('replyText').textContent = replyingTo.text;
            }
        }

        // ---------------- Scrolling ----------------
        function isNearBottom() {
            const el = document.getElementById('messages');
            return el.scrollHeight - el.scrollTop - el.clientHeight < 80;
        }

        // Scrolls to the newest message. smooth=true animates (live events);
        // false jumps (first load, keyboard resize). Runs next frame so layout
        // has settled. While our animation plays, scroll events are ignored so
        // its intermediate positions don't count as the reader scrolling up.
        function scrollToBottom(smooth) {
            const el = document.getElementById('messages');
            stickToBottom = true;
            setPill(false);
            autoScrolling = true;
            clearTimeout(autoScrollTimer);
            requestAnimationFrame(function() {
                el.scrollTo({ top: el.scrollHeight, behavior: smooth ? 'smooth' : 'instant' });
                autoScrollTimer = setTimeout(function() {
                    autoScrolling = false;
                    stickToBottom = isNearBottom();
                }, smooth ? 600 : 50);
            });
        }

        function setPill(show) { document.getElementById('newMsgBtn').classList.toggle('show', show); }

        document.getElementById('messages').addEventListener('scroll', function() {
            if (autoScrolling) return;
            stickToBottom = isNearBottom();
            if (stickToBottom) setPill(false);
        }, { passive: true });

        // ---------------- Replies ----------------
        function clip(t) { return t.length > REPLY_PREVIEW_LEN ? t.slice(0, REPLY_PREVIEW_LEN) + '…' : t; }

        function setQuoteDeleted(q) {
            q.classList.add('deleted');
            q.querySelector('.rq-name').textContent = 'Reply';
            q.querySelector('.rq-text').textContent = 'Original message was deleted';
        }

        // The quoted snippet shown above a reply.
        function buildQuote(id, r) {
            const q = document.createElement('div');
            q.className = 'reply-quote';
            q.dataset.replyId = id;
            const name = document.createElement('span');
            name.className = 'rq-name';
            const text = document.createElement('span');
            text.className = 'rq-text';
            q.appendChild(name);
            q.appendChild(text);
            if (!r || r.deleted) {
                setQuoteDeleted(q);
            } else {
                name.textContent = r.username;
                text.textContent = r.text;
                q.addEventListener('click', function(e) { e.stopPropagation(); jumpToMessage(id); });
            }
            return q;
        }

        // Scrolls the original into view and briefly highlights it (if still loaded).
        function jumpToMessage(id) {
            const target = document.querySelector('.msg[data-id="' + id + '"]');
            if (!target) return;
            target.scrollIntoView({ behavior: 'smooth', block: 'center' });
            target.classList.remove('flash');
            void target.offsetWidth; // restart the animation
            target.classList.add('flash');
        }

        function startReply(div) {
            const textEl = div.querySelector('.text');
            replyingTo = {
                id: Number(div.dataset.id),
                username: div.dataset.username,
                text: clip(textEl ? textEl.textContent : '')
            };
            const follow = stickToBottom;
            document.getElementById('replyName').textContent = 'Replying to ' + replyingTo.username;
            document.getElementById('replyText').textContent = replyingTo.text;
            document.getElementById('replyBar').style.display = 'flex';
            closeEmojiPicker();
            if (follow) scrollToBottom(false); // the bar shrinks the list; keep the latest message in view
            document.getElementById('msgInput').focus();
        }

        function clearReply() {
            replyingTo = null;
            document.getElementById('replyBar').style.display = 'none';
        }

        // Touch devices have no hover, so tapping a message toggles its toolbar
        // (one open at a time); tapping anywhere else closes it.
        const isTouch = window.matchMedia('(hover: none)');
        function closeTools() {
            const open = document.querySelector('.msg.show-tools');
            if (open) open.classList.remove('show-tools');
        }
        document.getElementById('messages').addEventListener('click', function(e) {
            if (!isTouch.matches || e.target.closest('.msg-tools, .reply-quote, .edit-input')) return;
            const row = e.target.closest('.msg');
            const open = document.querySelector('.msg.show-tools');
            if (open && open !== row) open.classList.remove('show-tools');
            if (row) row.classList.toggle('show-tools');
        });
        document.addEventListener('click', function(e) { if (!e.target.closest('.msg')) closeTools(); });

        boot();
    </script>
</body>
</html>
